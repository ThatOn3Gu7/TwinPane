name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: TwinPane is intentionally small. Please describe the problem first; we can then find the simplest way to solve it.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I …, I have to …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work (keys, touch, dialogs)?
  - type: dropdown
    id: platform
    attributes:
      label: Where would you use it?
      multiple: true
      options:
        - Android (Termux)
        - Linux
        - macOS
